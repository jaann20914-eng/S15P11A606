spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Publisher Confirm(correlated) + mandatory 반환 콜백 활성화
    publisher-confirm-type: correlated
    publisher-returns: true

kakao:
  local:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY}
    connect-timeout-ms: 3000
    read-timeout-ms: 3000

oauth:
  kakao:
    # 카카오 OAuth의 client_id는 앱의 REST API 키다 (지도 검색과 동일 앱 → 기존 키 재사용)
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com
    api-uri: https://kapi.kakao.com
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
    token-uri: https://nid.naver.com
    api-uri: https://openapi.naver.com

app:
  oauth:
    # 웹 OAuth 콜백을 앱으로 되돌릴 커스텀 스킴 (app.json의 scheme와 일치)
    callback-scheme: ${OAUTH_CALLBACK_SCHEME}

internal:
  api:
    # 내부 시스템(AI Worker)이 /api/v1/internal/** 호출 시 보내는 X-Internal-Secret 값.
    secret: ${INTERNAL_API_SECRET}

jwt:
  secret: ${JWT_SECRET}
  issuer: wagglewaggle
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600
  onboarding-token-expiration-seconds: 600

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    upload-url-expiration-seconds: ${AWS_S3_UPLOAD_URL_EXPIRATION_SECONDS:600}
    download-url-expiration-seconds: ${AWS_S3_DOWNLOAD_URL_EXPIRATION_SECONDS:600}

pin:
  upload:
    # 원본 영상 최대 크기 (기본 100MB)
    max-video-size-bytes: ${MAX_VIDEO_SIZE_BYTES:104857600}
  registration:
    # 회원 1인의 하루 핀 등록 허용 개수. 정책값 미확정이라 기본 0(=미적용).
    # 값이 합의되면 DAILY_PIN_LIMIT 환경변수 또는 이 설정으로 양수를 지정한다.
    daily-limit: ${DAILY_PIN_LIMIT:0}

chat:
  profanity:
    # 1차 욕설 필터 전략. 기본은 dictionary(사전 부분일치, DictionaryProfanityFilter).
    # 추후 LDNOOBW 목록 + Aho-Corasick + 정규화 구현체(예: aho-corasick)를 추가하면
    # 이 값만 바꿔 교체한다(ChatMessageService 등 기존 코드는 수정 불필요).
    strategy: ${CHAT_PROFANITY_STRATEGY:dictionary}

ai:
  recommendation:
    # AI 추천점수 API(POST /api/v1/internal/recommendations/score) 호출 설정.
    base-url: ${AI_RECOMMENDATION_BASE_URL:http://localhost:8000}
    # Back↔AI 내부 통신 공유 비밀키(x-internal-api-key). AI의 INTERNAL_API_KEY와 동일해야 한다.
    internal-api-key: ${INTERNAL_API_KEY:}
    connect-timeout-ms: ${AI_RECOMMENDATION_CONNECT_TIMEOUT_MS:1000}
    # 응답 제한 시간 3초. 초과 시 AI_RECOMMENDATION_FAILED.
    # AI 스코어링 타임아웃(SCORING_TIMEOUT_MS=2000)보다 반드시 커야 한다.
    # 그래야 AI가 만든 504 SCORING_TIMEOUT 응답이 도달하고, 한계선 근처 성공 응답도
    # 파싱·직렬화·네트워크 오버헤드(여유 1000ms) 안에 정상 수신된다.
    read-timeout-ms: ${AI_RECOMMENDATION_READ_TIMEOUT_MS:3000}
  blur:
    republish:
      # 실패·장기 PENDING 작업 재발행 스케줄러 설정.
      enabled: ${AI_BLUR_REPUBLISH_ENABLED:true}
      # 재발행 조회 주기(ms). 기본 60초.
      interval-ms: ${AI_BLUR_REPUBLISH_INTERVAL_MS:60000}
      # 이 시간 이상 PENDING인 작업을 재발행 대상으로 본다. 기본 5분.
      pending-threshold: ${AI_BLUR_REPUBLISH_PENDING_THRESHOLD:PT5M}
  chat:
    analysis:
      # AI 2차 분석 배치 스케줄러 사용 여부.
      enabled: ${AI_CHAT_ANALYSIS_ENABLED:true}
      # 방별 미분석 메시지 그룹핑·발행 주기(ms). 기본 30초.
      interval-ms: ${AI_CHAT_ANALYSIS_INTERVAL_MS:30000}
