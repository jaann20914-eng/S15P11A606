spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

kakao:
  local:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY}
    connect-timeout-ms: 3000
    read-timeout-ms: 3000

oauth:
  kakao:
    # 카카오 OAuth의 client_id는 앱의 REST API 키다 (지도 검색과 동일 앱 → 기존 키 재사용)
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com
    api-uri: https://kapi.kakao.com
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
    token-uri: https://nid.naver.com
    api-uri: https://openapi.naver.com

app:
  oauth:
    # 웹 OAuth 콜백을 앱으로 되돌릴 커스텀 스킴 (app.json의 scheme와 일치)
    callback-scheme: ${OAUTH_CALLBACK_SCHEME}

jwt:
  secret: ${JWT_SECRET}
  issuer: wagglewaggle
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600
  onboarding-token-expiration-seconds: 600

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    upload-url-expiration-seconds: ${AWS_S3_UPLOAD_URL_EXPIRATION_SECONDS:600}

pin:
  upload:
    # 원본 영상 최대 크기 (기본 100MB)
    max-video-size-bytes: ${MAX_VIDEO_SIZE_BYTES:104857600}
  registration:
    # 회원 1인의 하루 핀 등록 허용 개수. 정책값 미확정이라 기본 0(=미적용).
    # 값이 합의되면 DAILY_PIN_LIMIT 환경변수 또는 이 설정으로 양수를 지정한다.
    daily-limit: ${DAILY_PIN_LIMIT:0}
