plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yuhan'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// jpa
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'


	// flyway (스키마 마이그레이션)
	// Spring Boot 4는 오토컨피그가 모듈별로 분리되어, Flyway 자동 실행을 위해 spring-boot-flyway 모듈이 필요하다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// PostGIS Point 매핑 (GEOGRAPHY(POINT,4326) ↔ JTS Point)
	implementation 'org.hibernate.orm:hibernate-spatial'


	// rabbitmq (ai.blur.request 발행)
	// Spring Boot 4는 오토컨피그가 모듈별로 분리되어, Rabbit 자동설정을 위해 spring-boot-amqp 모듈이 필요하다.
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-amqp'
	testImplementation 'org.testcontainers:rabbitmq'

	// elasticsearch
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

	// elasticsearch 테스트
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.6')
	testImplementation 'org.testcontainers:elasticsearch'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'

	// security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// validation (@Valid, GlobalExceptionHandler가 이미 대비)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// websocket + STOMP (채팅 실시간 통신)
	// starter가 서블릿 WebSocket 업그레이드 자동설정 모듈(spring-boot-websocket)을 전이로 포함한다.
	// (@EnableWebSocketMessageBroker로 STOMP 브로커는 직접 구성한다.)
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// JWT (jjwt 0.12.x)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// AWS S3 (Presigned URL) — SDK v2
	implementation platform('software.amazon.awssdk:bom:2.31.6')
	implementation 'software.amazon.awssdk:s3'

	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()

	// .env가 있으면 테스트 실행 환경변수로 주입
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def trimmed = line.trim()
			if (trimmed.isEmpty() || trimmed.startsWith('#') || !trimmed.contains('=')) {
				return
			}
			def idx = trimmed.indexOf('=')
			def key = trimmed.substring(0, idx).trim().replaceFirst(/^export\s+/, '')
			def value = trimmed.substring(idx + 1).trim().replaceAll(/^["']|["']$/, '')
			environment key, value
		}
	}
}
