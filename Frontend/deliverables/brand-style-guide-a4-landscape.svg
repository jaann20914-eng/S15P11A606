        <text x="20" y="42" class="label">Surface</text><text x="20" y="80" class="mono">#FFFFFF</text>
      </g>
      <g transform="translate(204 42)">
        <rect width="188" height="112" rx="26" fill="#F7F7F5" stroke="#E7E8E2" stroke-width="2"/>
        <text x="20" y="42" class="label">Background</text><text x="20" y="80" class="mono">#F7F7F5</text>
      </g>
      <g transform="translate(408 42)">
        <rect width="188" height="112" rx="26" fill="#F8FCE6"/>
        <text x="20" y="42" class="label">Soft Lime</text><text x="20" y="80" class="mono">#F8FCE6</text>
      </g>
      <g transform="translate(612 42)">
