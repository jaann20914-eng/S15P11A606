    <text class="sectionSub" y="42">Pretendard · 명확한 위계와 편안한 본문 리듬</text>

    <rect x="0" y="92" width="1080" height="650" rx="36" class="card"/>
    <text x="52" y="160" font-size="27" font-weight="500" fill="#92969C">FONT FAMILY</text>
    <text x="52" y="268" font-size="82" font-weight="700">Pretendard</text>
    <text x="52" y="322" class="body">Regular 400 · Medium 500 · SemiBold 600 · Bold 700</text>
    <line x1="52" y1="370" x2="1028" y2="370" stroke="#ECEDEA" stroke-width="2"/>

