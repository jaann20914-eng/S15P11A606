  <text x="156" y="2390" class="caption">MOBILE APPLICATION · REACT NATIVE / EXPO · 390×844 REFERENCE FRAME · ANDROID</text>
  <text x="3352" y="2390" text-anchor="end" class="caption">Design tokens v1.0</text>
