      <line x1="0" y1="180" x2="80" y2="180" stroke="#C4E600" stroke-width="22" stroke-linecap="round"/>
      <line x1="0" y1="230" x2="120" y2="230" stroke="#C4E600" stroke-width="22" stroke-linecap="round"/>
