      <circle cx="150" cy="145" r="58" fill="#FFFFFF"/>
      <ellipse cx="150" cy="463" rx="70" ry="16" fill="#000000" opacity=".18"/>
      <text x="150" y="530" text-anchor="middle" font-size="28" font-weight="600" class="white">Soft Plastic Pin</text>
