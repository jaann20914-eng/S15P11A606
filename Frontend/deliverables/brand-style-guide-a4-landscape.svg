<svg xmlns="http://www.w3.org/2000/svg" width="3508" height="2480" viewBox="0 0 3508 2480">
  <defs>
    <linearGradient id="progressGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FCE6"/>
      <stop offset="1" stop-color="#CCEFFD"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".88"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#3B3838" flood-opacity=".10"/>
    </filter>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; fill:#3B3838; }
      .eyebrow { font-size:28px; font-weight:600; letter-spacing:4px; fill:#89921F; }
      .display { font-size:104px; font-weight:700; letter-spacing:-3px; }
      .lead { font-size:34px; font-weight:400; fill:#6F7175; }
      .section { font-size:44px; font-weight:700; letter-spacing:-1px; }
      .sectionSub { font-size:25px; font-weight:400; fill:#92969C; }
      .h3 { font-size:29px; font-weight:600; }
      .body { font-size:26px; font-weight:400; fill:#6F7175; }
      .label { font-size:24px; font-weight:500; fill:#6F7175; }
      .caption { font-size:21px; font-weight:400; fill:#92969C; }
      .value { font-size:28px; font-weight:700; }
      .mono { font-family: Consolas, monospace; font-size:21px; fill:#6F7175; }
      .card { fill:#FFFFFF; stroke:#E7E8E2; stroke-width:2; }
      .white { fill:#FFFFFF; }
      .darkMuted { fill:#C9CAC6; }
    </style>
  </defs>

  <rect width="3508" height="2480" fill="#F7F7F5"/>

  <!-- Header -->
  <text x="156" y="150" class="eyebrow">FOUNDATION · MOBILE UX/UI</text>
  <text x="156" y="265" class="display">Style Guide</text>
  <text x="156" y="335" class="lead">쉽고 명확한 탐색, 신뢰할 수 있는 현장 정보, 가볍게 참여하는 보상 경험</text>

  <g transform="translate(2755 110)">
    <rect width="590" height="220" rx="40" fill="#3B3838"/>
    <circle cx="90" cy="82" r="34" fill="#C4E600"/>
    <circle cx="170" cy="82" r="34" fill="#FFBBBB"/>
    <circle cx="250" cy="82" r="34" fill="#CCEFFD"/>
    <text x="90" y="166" font-size="28" font-weight="600" class="white">Clear</text>
    <text x="200" y="166" font-size="28" font-weight="600" class="white">Trustworthy</text>
    <text x="385" y="166" font-size="28" font-weight="600" class="white">Interactive</text>
  </g>

  <line x1="156" y1="402" x2="3352" y2="402" stroke="#E0E2DD" stroke-width="2"/>

  <!-- Colors -->
