    <!-- 3D icon token -->
    <g transform="translate(785 210)">
      <rect x="25" y="30" width="220" height="220" rx="64" fill="#CCEFFD"/>
      <circle cx="135" cy="120" r="46" fill="#FFFFFF" opacity=".92"/>
      <path d="M72 186h126" stroke="#C4E600" stroke-width="30" stroke-linecap="round"/>
      <ellipse cx="135" cy="280" rx="86" ry="18" fill="#000000" opacity=".12"/>
