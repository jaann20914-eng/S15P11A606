      <text x="720" y="154" class="mono">Body 16 / 24 · 400</text>
      <text y="218" font-size="23" font-weight="400" fill="#92969C">2분 전 · 최근 등록순</text>
      <text x="720" y="218" class="mono">Caption 12 / 18 · 400</text>
