      <rect x="0" y="48" width="700" height="112" rx="32" fill="#FFFFFF" stroke="#C4E600" stroke-width="3"/>
      <text x="28" y="118" class="body">닉네임을 입력해주세요</text>
      <rect x="520" y="60" width="164" height="88" rx="25" fill="#C4E600"/>
      <text x="602" y="116" text-anchor="middle" font-size="26" font-weight="600">중복확인</text>
      <text x="0" y="194" class="caption">Input · H56 · R16 · Inline action</text>

      <g transform="translate(0 246)">
        <rect width="148" height="76" rx="38" fill="#3B3838"/><text x="74" y="50" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF">공원</text>
        <rect x="164" width="148" height="76" rx="38" fill="#FFFFFF" stroke="#E7E8E2" stroke-width="2"/><text x="238" y="50" text-anchor="middle" class="label">축제</text>
        <rect x="328" width="148" height="76" rx="38" fill="#C4E600"/><text x="402" y="50" text-anchor="middle" font-size="25" font-weight="600">맛집</text>
