        <rect x="330" width="280" height="140" rx="70" fill="#FFBBBB"/>
        <circle cx="395" cy="70" r="56" fill="#FFFFFF" filter="url(#shadow)"/>
        <text x="455" y="88" font-size="32" font-weight="600" fill="#9B5054">와글</text>
      </g>
